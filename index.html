<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pedang Bayangan — Kawanan Pedang dari Gestur Tangan</title>
<meta name="description" content="Efek partikel kawanan pedang bercahaya dengan black hole dan audio sub-bass yang dikendalikan gestur tangan lewat webcam — berjalan sepenuhnya di browser." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
  :root {
    --accent-a: #00f0ff;
    --accent-b: #7000ff;
    --bg: #000000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  video#input-video { display: none !important; }

  .hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(14px, 2.5vw, 24px); }
  .hud > * { pointer-events: auto; }

  .hud__top { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand__glyph { font-size: 22px; color: var(--accent-a); text-shadow: 0 0 14px var(--accent-a); }
  .brand__title { font-family: 'Cinzel', serif; font-size: clamp(16px, 2vw, 22px); font-weight: 700; letter-spacing: 0.06em; color: #fff; }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .icon-btn { background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; backdrop-filter: blur(10px); transition: all 0.2s; }
  .icon-btn:hover { border-color: var(--accent-a); color: var(--accent-a); }

  .color-hud { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 20; background: rgba(0,0,0,0.92); border: 1px solid var(--accent-a); padding: 10px 18px; border-radius: 20px; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; align-items: center; gap: 8px; backdrop-filter: blur(16px); box-shadow: 0 0 25px rgba(0,240,255,0.3); }
  .color-hud.active { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .color-hud__title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent-a); font-weight: 600; }
  .color-hud__swatches { display: flex; gap: 10px; }
  .color-hud__swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
  .color-hud__swatch.selected { border-color: #fff; transform: scale(1.25); box-shadow: 0 0 10px #fff; }
  .color-hud__bar { width: 140px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
  .color-hud__fill { height: 100%; background: var(--accent-a); width: 0%; transition: width 0.08s; }

  .start-hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 12; background: rgba(0,0,0,0.85); border: 1px solid rgba(0,240,255,0.3); padding: 16px 20px; border-radius: 16px; text-align: center; max-width: 320px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); transition: opacity 0.4s; }
  .start-hint b { display: block; font-family: 'Cinzel', serif; font-size: 16px; margin-bottom: 4px; color: var(--accent-a); }
  .start-hint p { font-size: 12px; color: rgba(255, 255, 255, 0.7); line-height: 1.4; }

  .hud__bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .status-pill { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.88); border: 1px solid rgba(255,255,255,0.12); padding: 7px 14px; border-radius: 30px; backdrop-filter: blur(12px); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-a); box-shadow: 0 0 8px var(--accent-a); animation: blinkDot 1.6s infinite; }
  .status-text { font-size: 12px; font-weight: 500; color: #fff; }

  .theme-swatches { display: flex; gap: 6px; background: rgba(0, 0, 0, 0.88); border: 1px solid rgba(255,255,255,0.12); padding: 5px 10px; border-radius: 30px; }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
  .swatch.active { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 8px #fff; }

  @keyframes blinkDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
</style>
</head>
<body>

  <video id="input-video" playsinline muted></video>
  <canvas id="scene"></canvas>

  <div class="color-hud" id="color-hud">
    <span class="color-hud__title">👎 Jempol Bawah: Geser Pilih Warna</span>
    <div class="color-hud__swatches" id="hud-swatches"></div>
    <div class="color-hud__bar"><div class="color-hud__fill" id="hud-fill"></div></div>
  </div>

  <div class="start-hint" id="start-hint">
    <b>Arahkan Tangan ke Kamera</b>
    <p>👍 Jempol atas: Angkasa • 👎 Jempol bawah: Warna • ✌️ V • 🤘 Rock • ✊ Kepalan</p>
  </div>

  <div class="hud">
    <div class="hud__top">
      <div class="brand">
        <span class="brand__glyph">⟡</span>
        <h1 class="brand__title">Pedang Bayangan</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-audio" title="Suara Sub-Bass">🔊</button>
        <button class="icon-btn" id="btn-flip" title="Ganti Kamera">🔄</button>
        <button class="icon-btn" id="btn-fs" title="Layar Penuh">⛶</button>
      </div>
    </div>

    <div class="hud__bottom">
      <div class="status-pill">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Mencari tangan...</span>
      </div>
      <div class="theme-swatches" id="theme-swatches"></div>
    </div>
  </div>

<script>
// ==================== PALET WARNA ====================
const PALETTES = [
  { name: 'Aether Cyan', primary: '#00f0ff', secondary: '#7000ff' },
  { name: 'Ember Crimson', primary: '#ff3344', secondary: '#ffaa00' },
  { name: 'Verdant Jade', primary: '#00ffaa', secondary: '#0066ff' },
  { name: 'Frost Azure', primary: '#70b5ff', secondary: '#ffffff' },
  { name: 'Solar Gold', primary: '#ffcc00', secondary: '#ff4400' },
  { name: 'Astral Void', primary: '#c050ff', secondary: '#ff00aa' }
];
let currentPaletteIdx = 0;

// ==================== WEB AUDIO SUB-BASS SYNTHESIZER ====================
let audioCtx = null;
let isAudioMuted = false;
let subOsc = null, subGain = null, masterGain = null;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);

    subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0.18, audioCtx.currentTime);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(75, audioCtx.currentTime);

    subOsc = audioCtx.createOscillator();
    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(43.65, audioCtx.currentTime);
    subOsc.connect(filter);
    filter.connect(subGain);
    subGain.connect(masterGain);
    subOsc.start();
  } catch (e) {}
}

function playSubDrop() {
  if (!audioCtx || isAudioMuted) return;
  try {
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(32, now + 0.8);
    g.gain.setValueAtTime(0.8, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.9);
  } catch (e) {}
}

function playWhoosh(spd) {
  if (!audioCtx || isAudioMuted) return;
  try {
    const now = audioCtx.currentTime;
    const dur = 0.22;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const fil = audioCtx.createBiquadFilter();
    fil.type = 'bandpass';
    fil.frequency.setValueAtTime(250 + Math.min(spd * 500, 1000), now);
    fil.frequency.exponentialRampToValueAtTime(140, now + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.3, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(fil);
    fil.connect(g);
    g.connect(masterGain);
    src.start(now);
  } catch (e) {}
}

function playChime(idx) {
  if (!audioCtx || isAudioMuted) return;
  try {
    const now = audioCtx.currentTime;
    const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(notes[idx % notes.length], now);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.55);
  } catch (e) {}
}

document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

document.getElementById('btn-audio').addEventListener('click', () => {
  initAudio();
  isAudioMuted = !isAudioMuted;
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(isAudioMuted ? 0 : 0.7, audioCtx.currentTime);
  }
  document.getElementById('btn-audio').textContent = isAudioMuted ? '🔇' : '🔊';
});

// ==================== PROCEDURAL SWORD TEXTURE ====================
function createSwordTexture() {
  const s = 128;
  const c = document.createElement('canvas');
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  ctx.translate(s/2, s/2);

  const grad = ctx.createLinearGradient(0, -s * 0.47, 0, s * 0.3);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0.95)');
  grad.addColorStop(1, 'rgba(255,255,255,0.1)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.47);
  ctx.lineTo(s * 0.065, -s * 0.02);
  ctx.lineTo(s * 0.028, s * 0.26);
  ctx.lineTo(-s * 0.028, s * 0.26);
  ctx.lineTo(-s * 0.065, -s * 0.02);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(-s * 0.15, s * 0.22, s * 0.30, s * 0.032);
  ctx.fillRect(-s * 0.018, s * 0.25, s * 0.036, s * 0.14);
  return new THREE.CanvasTexture(c);
}

// ==================== THREE.JS SETUP ====================
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(window.innerWidth < window.innerHeight ? 68 : 50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 9.2);

let viewH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.position.z;
let viewW = viewH * camera.aspect;

const fadeScene = new THREE.Scene();
const fadeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fadeMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthTest: false, depthWrite: false });
fadeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fadeMat));

// ==================== 3D BLACK HOLE ====================
const blackHole = new THREE.Group();
blackHole.position.set(0, 0.2, -5.5);

const ehGeo = new THREE.SphereGeometry(1.35, 48, 48);
const ehMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
blackHole.add(new THREE.Mesh(ehGeo, ehMat));

const prGeo = new THREE.RingGeometry(1.36, 1.52, 80);
const prMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(PALETTES[0].primary), side: THREE.DoubleSide, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false });
const photonRing = new THREE.Mesh(prGeo, prMat);
blackHole.add(photonRing);

const ACCRETION_N = 650;
const accGeo = new THREE.BufferGeometry();
const accPos = new Float32Array(ACCRETION_N * 3);
const accRadii = new Float32Array(ACCRETION_N);
const accAngles = new Float32Array(ACCRETION_N);
const accSpeeds = new Float32Array(ACCRETION_N);

for (let i = 0; i < ACCRETION_N; i++) {
  const r = 1.45 + Math.pow(Math.random(), 1.5) * 3.2;
  const a = Math.random() * Math.PI * 2;
  accRadii[i] = r;
  accAngles[i] = a;
  accSpeeds[i] = 1.6 / Math.sqrt(r);
  accPos[i*3] = Math.cos(a) * r;
  accPos[i*3+1] = (Math.random() - 0.5) * (0.12 + r * 0.04);
  accPos[i*3+2] = Math.sin(a) * r;
}
accGeo.setAttribute('position', new THREE.BufferAttribute(accPos, 3));
const accDisk = new THREE.Points(accGeo, new THREE.PointsMaterial({ color: 0xffeebb, size: 0.08, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
accDisk.rotation.x = Math.PI * 0.28;
accDisk.rotation.z = Math.PI * 0.08;
blackHole.add(accDisk);
scene.add(blackHole);

// ==================== BINTANG BERJALAN ====================
const STAR_COUNT = 700;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
const starSpeeds = new Float32Array(STAR_COUNT);
for (let i = 0; i < STAR_COUNT; i++) {
  starPos[i*3] = (Math.random() - 0.5) * 44;
  starPos[i*3+1] = (Math.random() - 0.5) * 32;
  starPos[i*3+2] = -50 + Math.random() * 60;
  starSpeeds[i] = 0.08 + Math.random() * 0.22;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xc8d6ff, size: 0.065, transparent: true, opacity: 0.7, sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(stars);

// ==================== SWORD PARTICLES ====================
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;
const PARTICLE_COUNT = isMobile ? 750 : 1250;
const swordTexture = createSwordTexture();

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: { uTexture: { value: swordTexture } },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aSize;
    attribute vec3 aColor;
    varying vec3 vColor;
    void main() {
      vColor = aColor;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (350.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTexture;
    varying vec3 vColor;
    void main() {
      vec4 tex = texture2D(uTexture, gl_PointCoord);
      if (tex.a < 0.03) discard;
      gl_FragColor = vec4(vColor * tex.rgb, tex.a);
    }
  `
});

const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const colorsAttr = new Float32Array(PARTICLE_COUNT * 3);
const sizesAttr = new Float32Array(PARTICLE_COUNT);
const seeds = new Float32Array(PARTICLE_COUNT);
const angles = new Float32Array(PARTICLE_COUNT);
const radii = new Float32Array(PARTICLE_COUNT);
const thetas = new Float32Array(PARTICLE_COUNT);
const phis = new Float32Array(PARTICLE_COUNT);
const colorMix = new Float32Array(PARTICLE_COUNT);
const baseSize = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  seeds[i] = Math.random() * 1000;
  angles[i] = Math.random() * Math.PI * 2;
  radii[i] = 0.55 + Math.random() * 2.8;
  thetas[i] = Math.acos(2 * Math.random() - 1);
  phis[i] = Math.random() * Math.PI * 2;
  colorMix[i] = Math.random();
  baseSize[i] = 0.55 + Math.random() * 0.95;
  positions[i*3] = (Math.random() - 0.5) * 8;
  positions[i*3+1] = (Math.random() - 0.5) * 6;
  positions[i*3+2] = (Math.random() - 0.5) * 4;
  sizesAttr[i] = baseSize[i];
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(colorsAttr, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(sizesAttr, 1));
const swarm = new THREE.Points(pGeo, particleMaterial);
scene.add(swarm);

// ==================== NEON SKELETON ====================
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]
];
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(HAND_CONNECTIONS.length * 6), 3));
const skeleton = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.9 }));
skeleton.visible = false;
scene.add(skeleton);

// ==================== MEDIAPIPE TRACKING ====================
const video = document.getElementById('input-video');
let activeGesture = 'none';
let isColorPickerOpen = false;
let colorSlideProgress = 0;
let isCosmicMode = false;
let handVelocity = { x: 0, y: 0 };
let lastHandPos = null;
let currentLandmarks = null;

function dist(p1, p2) {
  const dx = p1.x - p2.x, dy = p1.y - p2.y, dz = (p1.z||0) - (p2.z||0);
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}
function isExt(tip, pip, wrist) {
  return dist(tip, wrist) > dist(pip, wrist) * 1.15;
}

function onResults(results) {
  const startHint = document.getElementById('start-hint');
  const statusText = document.getElementById('status-text');

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    if (startHint) startHint.style.opacity = '0';
    const lm = results.multiHandLandmarks[0];
    currentLandmarks = lm;
    skeleton.visible = true;

    const curPos = { x: lm[0].x, y: lm[0].y };
    if (lastHandPos) {
      handVelocity.x = (curPos.x - lastHandPos.x) * 20;
      handVelocity.y = (curPos.y - lastHandPos.y) * 20;
      const spd = Math.hypot(handVelocity.x, handVelocity.y);
      if (spd > 0.4) playWhoosh(spd);
    }
    lastHandPos = curPos;

    const wrist = lm[0];
    const thumbTip = lm[4], thumbIp = lm[3], thumbMcp = lm[2];
    const indexTip = lm[8], indexPip = lm[6];
    const midTip = lm[12], midPip = lm[10];
    const ringTip = lm[16], ringPip = lm[14];
    const pinkyTip = lm[20], pinkyPip = lm[18];

    const thumbExt = dist(thumbTip, wrist) > dist(thumbMcp, wrist) * 1.05;
    const indexExt = isExt(indexTip, indexPip, wrist);
    const midExt = isExt(midTip, midPip, wrist);
    const ringExt = isExt(ringTip, ringPip, wrist);
    const pinkyExt = isExt(pinkyTip, pinkyPip, wrist);
    const otherCurled = !indexExt && !midExt && !ringExt && !pinkyExt;

    const thumbUp = thumbTip.y < thumbIp.y - 0.02 && thumbIp.y < thumbMcp.y;
    const thumbDown = thumbTip.y > thumbIp.y + 0.02 && thumbIp.y > thumbMcp.y - 0.05;

    if (thumbDown && otherCurled && thumbExt) {
      activeGesture = 'thumbs_down';
      isColorPickerOpen = true;
      colorSlideProgress = Math.max(0, Math.min(1, (1.0 - wrist.x - 0.15) / 0.70));
      const targetIdx = Math.min(PALETTES.length - 1, Math.floor(colorSlideProgress * PALETTES.length));
      if (targetIdx !== currentPaletteIdx) {
        selectPalette(targetIdx);
        playChime(targetIdx);
      }
      statusText.textContent = 'Jempol Bawah: Geser Pilih Warna';
    } else if (thumbUp && otherCurled && thumbExt) {
      if (!isCosmicMode) playSubDrop();
      activeGesture = 'thumbs_up';
      isCosmicMode = true;
      statusText.textContent = 'Jempol Atas: Angkasa & Supernova';
    } else if (indexExt && midExt && !ringExt && !pinkyExt) {
      activeGesture = 'peace';
      statusText.textContent = 'Tanda V: Hujan Pedang';
    } else if (indexExt && !midExt && !ringExt && pinkyExt) {
      activeGesture = 'rock';
      statusText.textContent = 'Tanda Rock: Bola Anyaman';
    } else if (!indexExt && !midExt && !ringExt && !pinkyExt) {
      if (isCosmicMode) playSubDrop();
      activeGesture = 'fist';
      isCosmicMode = false;
      isColorPickerOpen = false;
      statusText.textContent = 'Kepalan: Singularitas Portal';
    } else if (indexExt && midExt && ringExt && pinkyExt) {
      activeGesture = 'open_palm';
      isColorPickerOpen = false;
      statusText.textContent = 'Telapak Terbuka: Ledakan Cincin';
    } else {
      activeGesture = 'flow';
      statusText.textContent = 'Kawanan Mengalir Mengikuti Tangan';
    }

    const colorHud = document.getElementById('color-hud');
    const hudFill = document.getElementById('hud-fill');
    if (isColorPickerOpen) {
      colorHud.classList.add('active');
      hudFill.style.width = (colorSlideProgress * 100) + '%';
    } else {
      colorHud.classList.remove('active');
    }

  } else {
    currentLandmarks = null;
    skeleton.visible = false;
    statusText.textContent = 'Mencari tangan...';
    if (startHint) startHint.style.opacity = '1';
  }
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
hands.onResults(onResults);

let facingMode = 'user';
let cameraInstance = null;
function startCamera() {
  if (cameraInstance) cameraInstance.stop();
  cameraInstance = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640,
    height: 480,
    facingMode: facingMode
  });
  cameraInstance.start();
}
startCamera();

document.getElementById('btn-flip').addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
});

document.getElementById('btn-fs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

// ==================== PALETTE SELECTION ====================
function selectPalette(idx) {
  currentPaletteIdx = idx;
  const p = PALETTES[idx];
  document.documentElement.style.setProperty('--accent-a', p.primary);
  document.documentElement.style.setProperty('--accent-b', p.secondary);
  photonRing.material.color.set(p.primary);
  document.querySelectorAll('.swatch').forEach((s, i) => {
    s.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.color-hud__swatch').forEach((s, i) => {
    s.classList.toggle('selected', i === idx);
  });
}

const swatchRow = document.getElementById('theme-swatches');
const hudSwatches = document.getElementById('hud-swatches');
PALETTES.forEach((p, idx) => {
  const btn = document.createElement('div');
  btn.className = 'swatch' + (idx === 0 ? ' active' : '');
  btn.style.backgroundColor = p.primary;
  btn.onclick = () => { selectPalette(idx); playChime(idx); };
  swatchRow.appendChild(btn);

  const hBtn = document.createElement('div');
  hBtn.className = 'color-hud__swatch' + (idx === 0 ? ' selected' : '');
  hBtn.style.backgroundColor = p.primary;
  hBtn.onclick = () => { selectPalette(idx); playChime(idx); };
  hudSwatches.appendChild(hBtn);
});

// ==================== ANIMATION LOOP ====================
const clock = new THREE.Clock();
const anchorSmooth = new THREE.Vector3(0, 0.2, 0);
const anchorRaw = new THREE.Vector3();
const targetPos = new THREE.Vector3();
const colorA = new THREE.Color(PALETTES[0].primary);
const colorB = new THREE.Color(PALETTES[0].secondary);
const tempCol = new THREE.Color();

function mapToWorld(lm) {
  return new THREE.Vector3((0.5 - lm.x) * viewW * 0.92, (0.5 - lm.y) * viewH * 0.92, -(lm.z||0) * 8);
}

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  colorA.lerp(new THREE.Color(PALETTES[currentPaletteIdx].primary), 0.08);
  colorB.lerp(new THREE.Color(PALETTES[currentPaletteIdx].secondary), 0.08);

  if (currentLandmarks && currentLandmarks.length >= 21) {
    anchorRaw.copy(mapToWorld(currentLandmarks[9] || currentLandmarks[0]));
    anchorSmooth.lerp(anchorRaw, 0.2);

    const lp = lineGeo.attributes.position.array;
    HAND_CONNECTIONS.forEach(([a, b], idx) => {
      const p1 = mapToWorld(currentLandmarks[a]);
      const p2 = mapToWorld(currentLandmarks[b]);
      lp[idx*6] = p1.x; lp[idx*6+1] = p1.y; lp[idx*6+2] = p1.z;
      lp[idx*6+3] = p2.x; lp[idx*6+4] = p2.y; lp[idx*6+5] = p2.z;
    });
    lineGeo.attributes.position.needsUpdate = true;
    skeleton.material.color.copy(colorA);
  } else {
    anchorSmooth.lerp(new THREE.Vector3(0, 0.2, 0), 0.05);
  }

  const accP = accGeo.attributes.position.array;
  for (let i = 0; i < ACCRETION_N; i++) {
    accAngles[i] += accSpeeds[i] * 0.015;
    accP[i*3] = Math.cos(accAngles[i]) * accRadii[i];
    accP[i*3+2] = Math.sin(accAngles[i]) * accRadii[i];
  }
  accGeo.attributes.position.needsUpdate = true;
  blackHole.rotation.y = time * 0.06;
  photonRing.scale.setScalar(1.0 + 0.025 * Math.sin(time * 3.0));

  const sPos = starGeo.attributes.position.array;
  const speedMul = isCosmicMode ? 5.5 : 1.0;
  for (let i = 0; i < STAR_COUNT; i++) {
    sPos[i*3+2] += starSpeeds[i] * speedMul;
    if (sPos[i*3+2] > 9.5) {
      sPos[i*3+2] = -50 - Math.random() * 15;
      sPos[i*3] = (Math.random() - 0.5) * 44;
      sPos[i*3+1] = (Math.random() - 0.5) * 32;
    }
  }
  starGeo.attributes.position.needsUpdate = true;

  const pPos = pGeo.attributes.position.array;
  const pCol = pGeo.attributes.aColor.array;
  const pSiz = pGeo.attributes.aSize.array;
  const spring = isCosmicMode ? 0.15 : 0.12;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const s = seeds[i];
    if (activeGesture === 'thumbs_down') {
      const ratio = i / PARTICLE_COUNT;
      const arc = (ratio - 0.5) * Math.PI * 1.6 + (colorSlideProgress - 0.5) * Math.PI * 0.8;
      const r = 2.2 + (s % 10) * 0.08;
      targetPos.set(anchorSmooth.x + Math.cos(arc) * r, anchorSmooth.y + 0.8 + Math.sin(arc) * (r * 0.4), anchorSmooth.z + Math.sin(ratio * 12 + time) * 0.4);
      pSiz[i] = baseSize[i] * 1.25;
    } else if (activeGesture === 'thumbs_up') {
      const spAng = (i / PARTICLE_COUNT) * Math.PI * 12 + time * 1.5;
      const spR = 0.9 + (i / PARTICLE_COUNT) * 5.0;
      targetPos.set(anchorSmooth.x + Math.cos(spAng) * spR, anchorSmooth.y + 0.8 + Math.sin(spAng) * spR * 0.55, anchorSmooth.z + Math.sin(time * 2 + s) * 1.6 - 1.2);
      pSiz[i] = baseSize[i] * 1.5;
    } else if (activeGesture === 'peace') {
      const col = i % 25, row = Math.floor(i / 25);
      targetPos.set(anchorSmooth.x + (col / 24 - 0.5) * 6, anchorSmooth.y + (row / 30) * 5 - 0.8 + Math.sin(time * 2.2 + s) * 0.15, anchorSmooth.z + Math.sin(s * 2.7) * 0.8);
      pSiz[i] = baseSize[i] * 0.9;
    } else if (activeGesture === 'rock') {
      targetPos.set(anchorSmooth.x + 1.45 * Math.sin(thetas[i]) * Math.cos(phis[i] + time * 0.65), anchorSmooth.y + 1.0 + 1.45 * Math.cos(thetas[i]), anchorSmooth.z + 1.45 * Math.sin(thetas[i]) * Math.sin(phis[i] + time * 0.65));
      pSiz[i] = baseSize[i] * 0.95;
    } else if (activeGesture === 'fist') {
      const ang = angles[i] + time * 2.2, r = 0.75 + (radii[i] % 1) * 0.9;
      targetPos.set(anchorSmooth.x + Math.cos(ang) * r, anchorSmooth.y + 0.8 + Math.sin(ang) * r * 0.35, anchorSmooth.z + Math.sin(ang * 2 + s) * 0.6);
      pSiz[i] = baseSize[i] * 1.15;
    } else if (activeGesture === 'open_palm') {
      const ph = (time * 0.65 + s * 0.013) % 1.0, r = ph * 4.0, a = angles[i];
      targetPos.set(anchorSmooth.x + Math.cos(a) * r, anchorSmooth.y + 0.8 + Math.sin(a) * r * 0.85, anchorSmooth.z + Math.sin(ph * Math.PI) * 0.8);
      pSiz[i] = baseSize[i] * (1.1 - ph * 0.65);
    } else {
      targetPos.set(anchorSmooth.x + Math.cos(angles[i] + time * 0.5 + s) * radii[i] * 0.65, anchorSmooth.y + Math.sin(angles[i] * 1.3 + time * 0.55 + s) * radii[i] * 0.5 + 0.4, anchorSmooth.z + Math.sin(time * 0.35 + s) * 0.85);
      pSiz[i] = baseSize[i];
    }

    const ix = i * 3;
    const ax = (targetPos.x - pPos[ix]) * spring;
    const ay = (targetPos.y - pPos[ix+1]) * spring;
    const az = (targetPos.z - pPos[ix+2]) * spring;

    velocities[ix] = (velocities[ix] + ax + handVelocity.x * 0.05) * 0.85;
    velocities[ix+1] = (velocities[ix+1] + ay - handVelocity.y * 0.05) * 0.85;
    velocities[ix+2] = (velocities[ix+2] + az) * 0.85;

    pPos[ix] += velocities[ix];
    pPos[ix+1] += velocities[ix+1];
    pPos[ix+2] += velocities[ix+2];

    tempCol.copy(colorA).lerp(colorB, colorMix[i]).multiplyScalar(0.85 + 0.15 * Math.sin(time * 2.5 + s));
    pCol[ix] = tempCol.r; pCol[ix+1] = tempCol.g; pCol[ix+2] = tempCol.b;
  }

  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;

  renderer.clearDepth();
  renderer.render(fadeScene, fadeCamera);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.fov = window.innerWidth < window.innerHeight ? 68 : 50;
  camera.updateProjectionMatrix();
  viewH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.position.z;
  viewW = viewH * camera.aspect;
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
