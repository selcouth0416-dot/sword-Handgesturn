<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pedang Bayangan — Black Hole & Celestial Swarm</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
  :root {
    --void-0: #020208;
    --void-1: #060919;
    --panel-strong: rgba(6, 10, 26, 0.88);
    --edge: rgba(255, 255, 255, 0.12);
    --text-0: #f4f6ff;
    --text-1: #9aa1c9;
    --accent-a: #5eead4;
    --accent-b: #a78bfa;
    --font-display: "Cinzel", Georgia, serif;
    --font-ui: "Space Grotesk", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, var(--void-1), var(--void-0) 75%);
    color: var(--text-0); font-family: var(--font-ui);
    user-select: none; -webkit-user-select: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; }
  #input-video { display: none; }

  .color-hud {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel-strong); border: 1px solid var(--accent-a);
    border-radius: 9999px; padding: 6px 16px; display: flex; align-items: center; gap: 10px;
    backdrop-filter: blur(16px); z-index: 20; opacity: 0; pointer-events: none; transition: all 0.25s ease;
  }
  .color-hud.active { opacity: 1; pointer-events: auto; }
  .color-hud__swatches { display: flex; gap: 8px; }
  .color-hud__swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s;
  }
  .color-hud__swatch.selected { border-color: #fff; transform: scale(1.25); }

  .hud-top {
    position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 25;
  }
  .hud-btn {
    display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 50%; background: rgba(0,0,0,0.7); border: 1px solid var(--edge);
    color: #fff; cursor: pointer; backdrop-filter: blur(12px); transition: all 0.2s;
  }
  .hud-btn:hover { border-color: var(--accent-a); }

  .pip-container {
    position: fixed; bottom: 14px; right: 14px; width: 88px; height: 66px;
    border-radius: 10px; overflow: hidden; border: 1px solid var(--edge);
    background: #000; z-index: 25; box-shadow: 0 4px 18px rgba(0,0,0,0.8);
  }
  .pip-container video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<video id="input-video" playsinline muted></video>

<div class="color-hud" id="color-hud">
  <div class="color-hud__swatches" id="hud-swatches"></div>
</div>

<div class="hud-top">
  <button class="hud-btn" id="btn-audio" title="Audio">🔊</button>
  <button class="hud-btn" id="btn-fs" title="Fullscreen">⛶</button>
</div>

<div class="pip-container">
  <video id="pip-video" playsinline muted autoplay></video>
</div>

<script>
const THEMES = [
  { a: '#5eead4', b: '#a78bfa' },
  { a: '#f43f5e', b: '#fbbf24' },
  { a: '#38bdf8', b: '#818cf8' },
  { a: '#34d399', b: '#a3e635' },
  { a: '#c084fc', b: '#f472b6' },
  { a: '#facc15', b: '#f97316' },
  { a: '#ffffff', b: '#94a3b8' }
];
let currentThemeIdx = 0;

// Three.js Scene & Camera
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 8.5);

// Gargantua Realistic Black Hole
function createAccretionTexture() {
  const s = 512, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d'), cx = s / 2, cy = s / 2;
  const rGrad = ctx.createRadialGradient(cx, cy, s * 0.14, cx, cy, s * 0.49);
  rGrad.addColorStop(0, 'rgba(0,0,0,0)');
  rGrad.addColorStop(0.1, 'rgba(255,255,255,1.0)');
  rGrad.addColorStop(0.35, 'rgba(255,200,120,0.95)');
  rGrad.addColorStop(0.65, 'rgba(255,100,20,0.6)');
  rGrad.addColorStop(0.92, 'rgba(60,10,2,0.15)');
  rGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rGrad;
  ctx.fillRect(0, 0, s, s);

  const aGrad = ctx.createConicGradient(-Math.PI / 2, cx, cy);
  aGrad.addColorStop(0.0, 'rgba(255,255,255,1.0)');
  aGrad.addColorStop(0.35, 'rgba(210,190,170,0.85)');
  aGrad.addColorStop(0.7, 'rgba(70,40,30,0.3)');
  aGrad.addColorStop(1.0, 'rgba(255,255,255,1.0)');
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = aGrad;
  ctx.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(c);
}

const blackHole = new THREE.Group();
blackHole.position.set(0, 0.2, -5.5);
blackHole.add(new THREE.Mesh(new THREE.SphereGeometry(1.4, 64, 64), new THREE.MeshBasicMaterial({ color: 0x000000 })));

const prMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(THEMES[0].a), side: THREE.DoubleSide, transparent: true, opacity: 0.98, blending: THREE.AdditiveBlending, depthWrite: false });
const photonRing = new THREE.Mesh(new THREE.RingGeometry(1.41, 1.55, 100), prMat);
blackHole.add(photonRing);

const accTexture = createAccretionTexture();
const diskMat = new THREE.MeshBasicMaterial({ map: accTexture, side: THREE.DoubleSide, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false, color: new THREE.Color(THEMES[0].a) });
const eqDisk = new THREE.Mesh(new THREE.RingGeometry(1.48, 4.4, 96), diskMat);
eqDisk.rotation.x = Math.PI * 0.44;
blackHole.add(eqDisk);

const topLensMat = new THREE.MeshBasicMaterial({ map: accTexture, side: THREE.DoubleSide, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending, depthWrite: false, color: new THREE.Color(THEMES[0].b) });
const topLens = new THREE.Mesh(new THREE.RingGeometry(1.46, 3.8, 96, 1, 0, Math.PI), topLensMat);
topLens.rotation.x = -Math.PI * 0.08;
blackHole.add(topLens);

const btmLensMat = new THREE.MeshBasicMaterial({ map: accTexture, side: THREE.DoubleSide, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending, depthWrite: false, color: new THREE.Color(THEMES[0].b) });
const btmLens = new THREE.Mesh(new THREE.RingGeometry(1.46, 3.8, 96, 1, Math.PI, Math.PI), btmLensMat);
btmLens.rotation.x = Math.PI * 0.08;
blackHole.add(btmLens);

scene.add(blackHole);

// Stars
const STAR_COUNT = 750;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
const starSpeeds = new Float32Array(STAR_COUNT);
for (let i = 0; i < STAR_COUNT; i++) {
  starPos[i*3] = (Math.random() - 0.5) * 44;
  starPos[i*3+1] = (Math.random() - 0.5) * 32;
  starPos[i*3+2] = -50 + Math.random() * 60;
  starSpeeds[i] = 0.08 + Math.random() * 0.22;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xc8d6ff, size: 0.065, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(stars);

// Sharp Sword Texture
function createSwordTexture() {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.translate(s / 2, s / 2);

  const glow = ctx.createRadialGradient(0, -s * 0.08, s * 0.04, 0, -s * 0.08, s * 0.48);
  glow.addColorStop(0, 'rgba(255,255,255,0.4)');
  glow.addColorStop(0.35, 'rgba(255,255,255,0.15)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(-s * 0.4, -s * 0.5, s * 0.8, s);

  const blade = ctx.createLinearGradient(0, -s * 0.48, 0, s * 0.22);
  blade.addColorStop(0, 'rgba(255,255,255,1)');
  blade.addColorStop(0.5, 'rgba(240,250,255,0.96)');
  blade.addColorStop(1, 'rgba(180,220,255,0.85)');
  ctx.fillStyle = blade;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.48);
  ctx.lineTo(s * 0.038, -s * 0.38);
  ctx.lineTo(s * 0.032, s * 0.2);
  ctx.lineTo(s * 0.02, s * 0.22);
  ctx.lineTo(-s * 0.02, s * 0.22);
  ctx.lineTo(-s * 0.032, s * 0.2);
  ctx.lineTo(-s * 0.038, -s * 0.38);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(0, -s * 0.46); ctx.lineTo(0, s * 0.2); ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-s * 0.12, s * 0.21, s * 0.24, s * 0.026);
  ctx.fillRect(-s * 0.013, s * 0.24, s * 0.026, s * 0.14);

  return new THREE.CanvasTexture(c);
}

const PARTICLE_COUNT = 900;
const swordTexture = createSwordTexture();
const particleMaterial = new THREE.ShaderMaterial({
  uniforms: { uTexture: { value: swordTexture } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aSize; attribute vec3 aColor; attribute float aAngle;
    varying vec3 vColor; varying float vAngle;
    void main() {
      vColor = aColor; vAngle = aAngle;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (360.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTexture;
    varying vec3 vColor; varying float vAngle;
    void main() {
      vec2 p = gl_PointCoord - vec2(0.5);
      float c = cos(vAngle); float s = sin(vAngle);
      vec2 rot = vec2(c * p.x - s * p.y, s * p.x + c * p.y) + vec2(0.5);
      if (rot.x < 0.0 || rot.x > 1.0 || rot.y < 0.0 || rot.y > 1.0) discard;
      vec4 tex = texture2D(uTexture, rot);
      if (tex.a < 0.03) discard;
      gl_FragColor = vec4(vColor * tex.rgb, tex.a);
    }
  `
});

const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const colorsAttr = new Float32Array(PARTICLE_COUNT * 3);
const sizesAttr = new Float32Array(PARTICLE_COUNT);
const swordAngles = new Float32Array(PARTICLE_COUNT);
const seeds = new Float32Array(PARTICLE_COUNT);
const angles = new Float32Array(PARTICLE_COUNT);
const radii = new Float32Array(PARTICLE_COUNT);
const colorMix = new Float32Array(PARTICLE_COUNT);
const baseSize = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  seeds[i] = Math.random() * 1000;
  angles[i] = Math.random() * Math.PI * 2;
  radii[i] = 0.55 + Math.random() * 2.8;
  colorMix[i] = Math.random();
  baseSize[i] = 0.65 + Math.random() * 1.1;
  swordAngles[i] = Math.random() * Math.PI * 2;
  positions[i*3] = (Math.random() - 0.5) * 8;
  positions[i*3+1] = (Math.random() - 0.5) * 6;
  positions[i*3+2] = (Math.random() - 0.5) * 4;
  sizesAttr[i] = baseSize[i];
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(colorsAttr, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(sizesAttr, 1));
pGeo.setAttribute('aAngle', new THREE.BufferAttribute(swordAngles, 1));
const swarm = new THREE.Points(pGeo, particleMaterial);
scene.add(swarm);

// Theme Switcher
function selectTheme(idx) {
  currentThemeIdx = idx;
  const t = THEMES[idx];
  photonRing.material.color.set(t.a);
  diskMat.color.set(t.a);
  topLensMat.color.set(t.b);
  btmLensMat.color.set(t.b);
  document.querySelectorAll('.color-hud__swatch').forEach((s, i) => {
    s.classList.toggle('selected', i === idx);
  });
}

const hudSwatches = document.getElementById('hud-swatches');
THEMES.forEach((t, idx) => {
  const b = document.createElement('button');
  b.className = 'color-hud__swatch' + (idx === 0 ? ' selected' : '');
  b.style.background = `linear-gradient(135deg, ${t.a}, ${t.b})`;
  b.onclick = () => selectTheme(idx);
  hudSwatches.appendChild(b);
});

// Gesture & Hands Tracking
let activeGesture = 'none';
let anchor = new THREE.Vector3(0, 0, 0);

function onResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];
    anchor.set((0.5 - lm[9].x) * 7.5, (0.5 - lm[9].y) * 5.5, -(lm[9].z || 0) * 8);

    // Deteksi Jempol ke Bawah (Thumb Down)
    const isThumbDown = lm[4].y > lm[3].y && lm[3].y > lm[2].y && lm[8].y < lm[6].y;
    if (isThumbDown) {
      activeGesture = 'thumbs_down';
      document.getElementById('color-hud').classList.add('active');
      const normX = Math.max(0, Math.min(1, lm[4].x));
      const targetIdx = Math.floor(normX * THEMES.length);
      if (targetIdx !== currentThemeIdx && targetIdx >= 0 && targetIdx < THEMES.length) {
        selectTheme(targetIdx);
      }
    } else {
      activeGesture = 'none';
      document.getElementById('color-hud').classList.remove('active');
    }
  } else {
    document.getElementById('color-hud').classList.remove('active');
  }
}

const video = document.getElementById('input-video');
const pipVideo = document.getElementById('pip-video');
const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
hands.onResults(onResults);

const cameraMP = new Camera(video, {
  onFrame: async () => { await hands.send({ image: video }); },
  width: 640, height: 480
});
cameraMP.start();

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(s => {
  pipVideo.srcObject = s;
});

// Animation Loop
const clock = new THREE.Clock();
const targetPos = new THREE.Vector3();
const colorA = new THREE.Color(THEMES[0].a);
const colorB = new THREE.Color(THEMES[0].b);
const tempCol = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  colorA.lerp(new THREE.Color(THEMES[currentThemeIdx].a), 0.08);
  colorB.lerp(new THREE.Color(THEMES[currentThemeIdx].b), 0.08);

  blackHole.rotation.y = time * 0.06;
  eqDisk.rotation.z = time * 0.12;
  photonRing.scale.setScalar(1.0 + 0.025 * Math.sin(time * 3.0));

  // Update Partikel Pedang
  const pPos = pGeo.attributes.position.array;
  const pCol = pGeo.attributes.aColor.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const s = seeds[i];
    if (activeGesture === 'thumbs_down') {
      const arc = (i / PARTICLE_COUNT - 0.5) * Math.PI * 1.6;
      targetPos.set(anchor.x + Math.cos(arc) * 2.2, anchor.y + Math.sin(arc) * 0.9 + 0.4, anchor.z);
    } else {
      targetPos.set(anchor.x + Math.cos(angles[i] + time * 0.5 + s) * radii[i], anchor.y + Math.sin(angles[i] * 1.3 + time * 0.55 + s) * radii[i] * 0.6, anchor.z + Math.sin(time * 0.35 + s) * 0.85);
    }

    const ix = i * 3;
    velocities[ix] = (velocities[ix] + (targetPos.x - pPos[ix]) * 0.12) * 0.85;
    velocities[ix+1] = (velocities[ix+1] + (targetPos.y - pPos[ix+1]) * 0.12) * 0.85;
    velocities[ix+2] = (velocities[ix+2] + (targetPos.z - pPos[ix+2]) * 0.12) * 0.85;

    pPos[ix] += velocities[ix];
    pPos[ix+1] += velocities[ix+1];
    pPos[ix+2] += velocities[ix+2];

    const vx = velocities[ix], vy = velocities[ix+1];
    if (vx * vx + vy * vy > 0.0001) {
      const heading = Math.atan2(vy, vx) - Math.PI * 0.5;
      let diff = heading - swordAngles[i];
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      swordAngles[i] += diff * 0.18;
    }

    tempCol.copy(colorA).lerp(colorB, colorMix[i]).multiplyScalar(0.85 + 0.15 * Math.sin(time * 2.5 + s));
    pCol[ix] = tempCol.r; pCol[ix+1] = tempCol.g; pCol[ix+2] = tempCol.b;
  }

  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aAngle.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
document.getElementById('btn-fs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
</script>
</body>
</html>
