<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Sword Hand Gesture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: monospace; }
    canvas { display: block; }
  </style>
</head>
<body class="relative w-screen h-screen bg-slate-950 text-white select-none">
  <div id="canvas-container" class="absolute inset-0 w-full h-full"></div>

  <!-- Minimal Gesture Status -->
  <div class="fixed top-4 left-4 z-20 flex items-center gap-2 bg-slate-950/80 px-4 py-2 rounded-full border border-cyan-500/30 backdrop-blur-md">
    <div id="gesture-icon" class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse"></div>
    <span id="gesture-text" class="text-xs font-bold text-cyan-300 tracking-wider">CELESTIAL BLADES</span>
  </div>

  <!-- Slide Down Color Bar (Aktif saat kedua tangan diangkat) -->
  <div id="color-hud" class="fixed left-1/2 top-8 -translate-x-1/2 z-30 transition-all duration-300 opacity-0 pointer-events-none flex flex-col items-center gap-2 bg-slate-950/90 border border-cyan-500/50 px-6 py-3 rounded-2xl backdrop-blur-xl">
    <span class="text-xs text-cyan-300 font-mono tracking-widest animate-pulse">↓ SLIDE DOWN UNTUK PILIH WARNA ↓</span>
    <div id="color-palette-bar" class="flex gap-3 my-1"></div>
    <div class="w-48 h-1 bg-slate-800 rounded-full overflow-hidden">
      <div id="color-progress" class="h-full bg-cyan-400 transition-all duration-75" style="width: 0%"></div>
    </div>
  </div>

  <!-- PIP Webcam Preview -->
  <div class="fixed bottom-4 right-4 z-20 flex flex-col items-end gap-1">
    <div class="relative w-36 h-28 rounded-xl overflow-hidden border border-cyan-500/40 bg-slate-950 shadow-2xl">
      <video id="webcam-video" class="hidden" playsinline></video>
      <canvas id="pip-canvas" class="w-full h-full transform scale-x-[-1]"></canvas>
    </div>
    <span id="fps-label" class="text-[10px] text-cyan-400/80 font-mono">60 FPS • FILTER REAL-TIME</span>
  </div>

  <script>
    const PALETTES = [
      { name: 'Cyan Frost', hex: '#00f0ff' },
      { name: 'Solar Gold', hex: '#ffb700' },
      { name: 'Phoenix Flame', hex: '#ff1a4b' },
      { name: 'Void Violet', hex: '#aa15ff' },
      { name: 'Spirit Jade', hex: '#00ff88' },
      { name: 'Starlight', hex: '#ffffff' }
    ];
    let currentThemeIdx = 0;

    const paletteBar = document.getElementById('color-palette-bar');
    PALETTES.forEach((p, idx) => {
      const dot = document.createElement('div');
      dot.className = 'w-6 h-6 rounded-full border border-white/40 transition-transform';
      dot.style.backgroundColor = p.hex;
      dot.id = 'dot-' + idx;
      paletteBar.appendChild(dot);
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.015);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const pointLight = new THREE.PointLight(0x00f0ff, 4, 35);
    scene.add(pointLight);

    const bladeGeo = new THREE.CylinderGeometry(0.005, 0.045, 1.6, 4);
    bladeGeo.scale(0.3, 1, 1);
    bladeGeo.translate(0, 0.8, 0);

    const SWORD_COUNT = 850;
    const swordMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 0.85,
      roughness: 0.2,
      emissive: new THREE.Color(PALETTES[0].hex),
      emissiveIntensity: 0.6
    });

    const swordMesh = new THREE.InstancedMesh(bladeGeo, swordMat, SWORD_COUNT);
    swordMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(swordMesh);

    const dummy = new THREE.Object3D();
    const swords = [];
    for (let i = 0; i < SWORD_COUNT; i++) {
      const r = 3 + Math.random() * 10;
      const th = Math.random() * Math.PI * 2;
      swords.push({
        pos: new THREE.Vector3(Math.cos(th) * r, (Math.random() - 0.5) * 8, Math.sin(th) * r),
        targetPos: new THREE.Vector3(),
        rot: new THREE.Euler(),
        speed: 0.6 + Math.random() * 1.5,
        radius: r,
        phase: Math.random() * Math.PI * 2
      });
    }

    const STAR_COUNT = 3000;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 80;
      starPos[i + 1] = (Math.random() - 0.5) * 60;
      starPos[i + 2] = (Math.random() - 0.5) * 80 - 10;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ size: 0.45, color: 0x00f0ff, transparent: true, opacity: 0.8 });
    const starField = new THREE.Points(starGeo, starMat);
    scene.add(starField);

    class LowPass {
      constructor(alpha = 0.5) { this.alpha = alpha; this.y = null; this.s = null; }
      filter(v, a) {
        if (a !== undefined) this.alpha = a;
        if (this.y === null) { this.s = v; this.y = v; }
        else { this.y = this.alpha * v + (1 - this.alpha) * this.s; this.s = this.y; }
        return this.y;
      }
    }
    class OneEuro {
      constructor(minCutoff = 1.0, beta = 0.05) {
        this.minCutoff = minCutoff; this.beta = beta;
        this.xFilter = new LowPass(); this.dxFilter = new LowPass();
        this.lastTime = null;
      }
      filter(val, time) {
        if (!this.lastTime) { this.lastTime = time; return this.xFilter.filter(val); }
        const dt = Math.max((time - this.lastTime) / 1000, 0.001);
        this.lastTime = time;
        const dx = (val - (this.xFilter.y || val)) / dt;
        const edx = this.dxFilter.filter(dx, 0.5);
        const cutoff = this.minCutoff + this.beta * Math.abs(edx);
        const tau = 1.0 / (2 * Math.PI * cutoff);
        const alpha = 1.0 / (1.0 + tau / dt);
        return this.xFilter.filter(val, alpha);
      }
    }

    const filterHandX = new OneEuro(1.2, 0.08);
    const filterHandY = new OneEuro(1.2, 0.08);

    let handX = 0, handY = 0;
    let isCosmic = false;
    let activeGesture = 'none';
    let isColorPickerOpen = false;

    const videoElement = document.getElementById('webcam-video');
    const pipCanvas = document.getElementById('pip-canvas');
    const pipCtx = pipCanvas.getContext('2d');
    const colorHud = document.getElementById('color-hud');
    const colorProgress = document.getElementById('color-progress');
    const gestureText = document.getElementById('gesture-text');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      pipCanvas.width = 320; pipCanvas.height = 240;
      pipCtx.clearRect(0, 0, 320, 240);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const h0 = results.multiHandLandmarks[0];
        const now = performance.now();

        const rawX = (0.5 - h0[0].x) * 16;
        const rawY = (0.5 - h0[0].y) * 12;
        handX = filterHandX.filter(rawX, now);
        handY = filterHandY.filter(rawY, now);

        const thumbTip = h0[4], thumbIp = h0[3], indexTip = h0[8], indexPip = h0[6];
        const isThumbsUp = thumbTip.y < thumbIp.y - 0.04 && indexTip.y > indexPip.y;
        const isPointing = indexTip.y < indexPip.y && thumbTip.y > thumbIp.y;

        if (results.multiHandLandmarks.length >= 2) {
          const h1 = results.multiHandLandmarks[1];
          if (h0[0].y < 0.38 && h1[0].y < 0.38) {
            isColorPickerOpen = true;
            colorHud.style.opacity = '1';
            gestureText.innerText = 'COLOR SELECTION (SLIDE DOWN)';
          } else if (isColorPickerOpen) {
            const avgY = (h0[0].y + h1[0].y) / 2;
            const progress = Math.max(0, Math.min(1, (avgY - 0.25) / 0.55));
            colorProgress.style.width = (progress * 100) + '%';
            const targetIdx = Math.min(PALETTES.length - 1, Math.floor(progress * PALETTES.length));
            if (targetIdx !== currentThemeIdx) {
              currentThemeIdx = targetIdx;
              applyColorTheme(currentThemeIdx);
            }
            if (avgY > 0.85) {
              isColorPickerOpen = false;
              colorHud.style.opacity = '0';
            }
          }
        } else {
          if (isThumbsUp) {
            isCosmic = true;
            gestureText.innerText = 'GALAXY COSMOS AWAKENING';
          } else if (isPointing) {
            activeGesture = 'strike';
            gestureText.innerText = 'PIERCING SWORD MUDRA';
          } else {
            activeGesture = 'swarm';
            gestureText.innerText = 'WAN JIAN SWARM DOMAIN';
          }
        }

        results.multiHandLandmarks.forEach((lms) => {
          pipCtx.strokeStyle = '#00f0ff';
          pipCtx.lineWidth = 2;
          for (let i = 0; i < lms.length - 1; i++) {
            pipCtx.beginPath();
            pipCtx.moveTo((1 - lms[i].x) * 320, lms[i].y * 240);
            pipCtx.lineTo((1 - lms[i + 1].x) * 320, lms[i + 1].y * 240);
            pipCtx.stroke();
          }
        });
      }
    });

    const cameraFeed = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 640, height: 480
    });
    cameraFeed.start().catch((err) => console.log('Camera error:', err));

    function applyColorTheme(idx) {
      const p = PALETTES[idx];
      swordMat.emissive.set(p.hex);
      pointLight.color.set(p.hex);
      starMat.color.set(p.hex);
      PALETTES.forEach((_, i) => {
        const d = document.getElementById('dot-' + i);
        if (d) d.style.transform = i === idx ? 'scale(1.3)' : 'scale(1.0)';
      });
    }

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      const targetCamX = handX * 0.45;
      const targetCamY = handY * 0.45;
      const targetCamZ = isCosmic ? 24 : 18;
      camera.position.x += (targetCamX - camera.position.x) * 0.12;
      camera.position.y += (targetCamY - camera.position.y) * 0.12;
      camera.position.z += (targetCamZ - camera.position.z) * 0.10;
      camera.lookAt(handX * 0.2, handY * 0.2, 0);

      starField.rotation.y = time * 0.02;
      starField.scale.setScalar(isCosmic ? 2.5 : 1.0);

      for (let i = 0; i < SWORD_COUNT; i++) {
        const s = swords[i];
        const theta = s.phase + time * s.speed * (isCosmic ? 1.4 : 1.0);
        const r = s.radius * (isCosmic ? 1.5 : 1.0);

        if (activeGesture === 'strike') {
          const off = ((i * 0.3 + time * 15) % 30) - 15;
          s.targetPos.set(handX + Math.sin(i) * 1.2, handY + Math.cos(i) * 1.2, off);
          s.rot.set(-Math.PI / 2, 0, 0);
        } else {
          s.targetPos.set(
            handX + Math.cos(theta) * r,
            handY + Math.sin(theta * 1.2) * (r * 0.5) + Math.sin(time + i) * 0.5,
            Math.sin(theta) * (r * 0.8)
          );
          s.rot.set(Math.sin(theta) * 0.5, Math.cos(theta) * 0.5, theta + Math.PI / 2);
        }

        s.pos.lerp(s.targetPos, 0.08);

        dummy.position.copy(s.pos);
        dummy.rotation.copy(s.rot);
        dummy.updateMatrix();
        swordMesh.setMatrixAt(i, dummy.matrix);
      }
      swordMesh.instanceMatrix.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
